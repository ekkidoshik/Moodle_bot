<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="referrer" content="no-referrer">
  <title>Moodle · Учёба</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand"><span class="brand-icon" aria-hidden="true">М</span><span>Moodle</span></div>
      <div class="header-actions">
        <span class="group" id="group" hidden></span>
        <button id="favorites" class="settings-button" type="button" aria-label="Избранное" hidden>☆</button>
        <button id="settings" class="settings-button" type="button" aria-label="Настройки" hidden>⚙</button>
      </div>
    </header>
    <main id="view" aria-live="polite">
      <section class="hero"><h1>Мой Moodle</h1><p>Загружаем данные…</p></section>
    </main>
    <nav id="tabs" class="tabs" aria-label="Разделы приложения" hidden>
      <button data-tab="home" aria-current="page"><span aria-hidden="true">⌂</span>Главная</button>
      <button data-tab="courses"><span aria-hidden="true">▤</span>Курсы</button>
      <button data-tab="deadlines"><span aria-hidden="true">◷</span>Дедлайны</button>
      <button data-tab="search"><span aria-hidden="true">⌕</span>Поиск</button>
    </nav>
  </div>
</body>
</html>
